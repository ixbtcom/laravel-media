name: coverage

on:
  workflow_dispatch:
  push:
    paths:
      - "**.php"
      - ".github/workflows/coverage.yml"
      - "phpunit.xml.dist"
      - "composer.json"
      - "composer.lock"

permissions:
  contents: read

jobs:
  pest:
    name: pest
    runs-on: [self-hosted, Linux, X64, docker]
    container: chialab/php-dev:8.4
    env:
      COMPOSER_ALLOW_SUPERUSER: "1"
      COMPOSER_HOME: ${{ github.workspace }}/.composer-home
      COMPOSER_VERSION: "2.11.1"
      PHP_RUNTIME: "8.4"
      XDEBUG_MODE: coverage
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Prepare PHP container
        run: |
          mkdir -p "$COMPOSER_HOME" build
          chmod 0700 "$COMPOSER_HOME"
          php --version
          composer self-update "$COMPOSER_VERSION" --no-interaction
          composer --version
          test "$(composer --version --no-ansi | cut -d' ' -f3)" = "$COMPOSER_VERSION"
          test "$(php -r 'echo PHP_MAJOR_VERSION.".".PHP_MINOR_VERSION;')" = "$PHP_RUNTIME"
          if ! php -r 'exit(extension_loaded("pcntl") ? 0 : 1);'; then
            install-php-extensions pcntl
          fi
          for extension in dom curl libxml mbstring zip pcntl pdo sqlite3 pdo_sqlite bcmath soap intl gd exif iconv imagick fileinfo; do
            if ! php -r "exit(extension_loaded('$extension') ? 0 : 1);"; then
              echo "Missing PHP extension $extension" >&2
              exit 1
            fi
          done
          php -r 'if (!extension_loaded("xdebug")) { fwrite(STDERR, "Xdebug is required for coverage\n"); exit(1); }'

      - name: Prepare media tools inside container
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends ffmpeg ghostscript imagemagick
          policy_found=0
          for policy in /etc/ImageMagick-*/policy.xml; do
            if [ -f "$policy" ]; then
              sed -i 's/none/read|write/g' "$policy"
              policy_found=1
            fi
          done
          if [ "$policy_found" -ne 1 ]; then
            echo "ImageMagick policy.xml was not found" >&2
            exit 1
          fi
          ffmpeg -version
          gs --version
          php --ri imagick

      - name: Install composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Audit dependencies
        run: |
          mkdir -p build
          composer audit --format=json > build/composer-audit.json

      - name: Run Pest coverage
        run: ./vendor/bin/pest --coverage --min=50
      - name: Preserve audit and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: media-coverage
          path: |
            build/composer-audit.json
            build/coverage.txt
            build/logs/clover.xml
            build/report.junit.xml
            composer.lock
